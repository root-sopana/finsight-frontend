stages:
  - build
  - deploy

variables:
  NODE_ENV: "production"

build:
  stage: build
  tags:
    - pipeline-runner
  script:
    - echo "Node version:"
    - node -v
    - echo "NPM version:"
    - npm -v

    - echo "Installing dependencies..."
    - npm install

    - echo "Checking Angular CLI..."
    - ./node_modules/.bin/ng version

    - echo "Building Angular application..."
    - ./node_modules/.bin/ng build

    - echo "Checking build output..."
    - ls -la
    - find dist -maxdepth 4 -type f | head -50

deploy:
  stage: deploy
  tags:
    - pipeline-runner
  script:
    - echo "Building frontend Docker image..."
    - docker build -t finsight-frontend:latest .

    - echo "Deploying frontend..."
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh

  only:
    - main