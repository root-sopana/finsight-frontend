stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - pipeline-runner
  script:
    - node -v
    - npm -v
    - npm install --include=dev
    - ng version
    - ng build
    - ls -la dist

deploy:
  stage: deploy
  tags:
    - pipeline-runner
  script:
    - docker build -t finsight-frontend:latest .
    - chmod +x scripts/deploy.sh
    - ./scripts/deploy.sh
  only:
    - main